name: Site checks
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
      - run: python3 -m unittest discover -s tests -p 'test_deploy*.py'
      - run: for file in scripts/deploy/*.sh; do bash -n "$file"; done
      - run: php -l scripts/hostinger/index.php && php -l scripts/hostinger/sitemap.php

