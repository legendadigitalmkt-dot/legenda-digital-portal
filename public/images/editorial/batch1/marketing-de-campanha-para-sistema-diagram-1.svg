<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Ciclo de um sistema de crescimento</title><desc id="desc">Diagnosticar orienta executar. Executar produz eventos para medir. Medir alimenta aprender. Aprender revê diagnóstico e prioridades, formando um ciclo contínuo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#101B35"/></marker></defs><rect width="1400" height="760" fill="white"/><text x="60" y="60" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700">GROWTH INTELLIGENCE / LEGENDA DIGITAL</text><text x="60" y="117" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700">Da campanha ao sistema de crescimento</text><text x="60" y="158" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400">Campanhas são iniciativas dentro de uma rotina contínua de decisão, execução e aprendizagem.</text><text x="60" y="718" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400">MODELO CONCEITUAL • Sem escala quantitativa ou resultado medido.</text><rect x="90" y="227" width="440" height="115" rx="16" fill="white" stroke="#DCE3EC" stroke-width="2"/><text x="112" y="269" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">Diagnosticar</text><text x="112" y="306" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400">Definir problema e hipótese</text><rect x="840" y="227" width="440" height="115" rx="16" fill="#00D8B3" stroke="#DCE3EC" stroke-width="2"/><text x="862" y="269" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">Executar</text><text x="862" y="306" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400">Campanhas e rotina</text><rect x="840" y="465" width="440" height="115" rx="16" fill="white" stroke="#DCE3EC" stroke-width="2"/><text x="862" y="507" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">Medir</text><text x="862" y="544" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400">Eventos e resultado</text><rect x="90" y="465" width="440" height="115" rx="16" fill="#D8F36A" stroke="#DCE3EC" stroke-width="2"/><text x="112" y="507" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">Aprender</text><text x="112" y="544" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400">Rever decisão e prioridade</text><path d="M530,284 L840,284" fill="none" stroke="#101B35" stroke-width="3" marker-end="url(#arrow)"/><path d="M1060,342 L1060,465" fill="none" stroke="#101B35" stroke-width="3" marker-end="url(#arrow)"/><path d="M840,522 L530,522" fill="none" stroke="#101B35" stroke-width="3" marker-end="url(#arrow)"/><path d="M310,465 L310,342" fill="none" stroke="#101B35" stroke-width="3" marker-end="url(#arrow)"/></svg>