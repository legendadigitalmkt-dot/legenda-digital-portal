<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Focos de SEO, AEO e GEO</title><desc id="desc">SEO enfatiza descoberta em busca; AEO, perguntas e respostas; GEO, respostas generativas. Os três compartilham conteúdo útil, método explícito, fontes, estrutura e atualização. Os termos se sobrepõem.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#101B35"/></marker></defs><rect width="1400" height="760" fill="white"/><text x="60" y="60" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700">GROWTH INTELLIGENCE / LEGENDA DIGITAL</text><text x="60" y="117" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700">SEO, AEO e GEO: focos complementares</text><text x="60" y="158" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400">Termos e práticas se sobrepõem; não existe garantia universal de posição ou de citação.</text><text x="60" y="718" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400">MODELO CONCEITUAL • Sem escala quantitativa ou resultado medido.</text><rect x="70" y="245" width="370" height="155" rx="16" fill="white" stroke="#DCE3EC" stroke-width="2"/><text x="92" y="287" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">SEO</text><text x="92" y="324" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400">Descoberta em busca</text><text x="92" y="363" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400">Acesso, indexação e relevância</text><rect x="515" y="245" width="370" height="155" rx="16" fill="#00D8B3" stroke="#DCE3EC" stroke-width="2"/><text x="537" y="287" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">AEO</text><text x="537" y="324" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400">Perguntas e respostas</text><text x="537" y="363" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400">Clareza e resposta contextual</text><rect x="960" y="245" width="370" height="155" rx="16" fill="#D8F36A" stroke="#DCE3EC" stroke-width="2"/><text x="982" y="287" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">GEO</text><text x="982" y="324" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400">Respostas generativas</text><text x="982" y="363" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400">Evidência e conteúdo citável</text><rect x="70" y="470" width="1260" height="136" rx="16" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="2"/><text x="95" y="515" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700">BASE COMPARTILHADA</text><text x="95" y="558" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400">Conteúdo útil • método explícito • fontes • estrutura • atualização</text></svg>