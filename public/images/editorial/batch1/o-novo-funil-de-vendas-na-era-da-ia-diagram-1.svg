<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Jornada comercial com retornos</title><desc id="desc">Descoberta leva à avaliação, que leva à decisão. A decisão alimenta relacionamento. Relacionamento retorna à descoberta. É um modelo conceitual de jornada, sem escala de conversão.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#101B35"/></marker></defs><rect width="1400" height="760" fill="white"/><text x="60" y="60" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700">GROWTH INTELLIGENCE / LEGENDA DIGITAL</text><text x="60" y="117" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700">O funil é uma jornada com retornos</text><text x="60" y="158" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400">Descoberta, avaliação e relacionamento coexistem em diferentes pontos de contato.</text><text x="60" y="718" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400">MODELO CONCEITUAL • Sem escala quantitativa ou resultado medido.</text><rect x="70" y="249" width="260" height="115" rx="16" fill="white" stroke="#DCE3EC" stroke-width="2"/><text x="92" y="291" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">Descoberta</text><text x="92" y="328" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400">Busca, rede, indicação</text><rect x="465" y="249" width="300" height="115" rx="16" fill="#00D8B3" stroke="#DCE3EC" stroke-width="2"/><text x="487" y="291" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">Avaliação</text><text x="487" y="328" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400">Evidência e contexto</text><rect x="930" y="249" width="350" height="115" rx="16" fill="white" stroke="#DCE3EC" stroke-width="2"/><text x="952" y="291" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">Decisão</text><text x="952" y="328" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400">Conversa e proposta</text><path d="M330,304 L465,304" fill="none" stroke="#101B35" stroke-width="3" marker-end="url(#arrow)"/><path d="M765,304 L930,304" fill="none" stroke="#101B35" stroke-width="3" marker-end="url(#arrow)"/><rect x="465" y="500" width="300" height="115" rx="16" fill="#D8F36A" stroke="#DCE3EC" stroke-width="2"/><text x="487" y="542" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">Relacionamento</text><text x="487" y="579" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400">Uso, retorno e indicação</text><path d="M1105,364 L1105,557" fill="none" stroke="#101B35" stroke-width="3" marker-end="url(#arrow)"/><path d="M1105,557 L765,557" fill="none" stroke="#101B35" stroke-width="3" marker-end="url(#arrow)"/><path d="M465,557 L200,557" fill="none" stroke="#101B35" stroke-width="3" marker-end="url(#arrow)"/><path d="M200,557 L200,364" fill="none" stroke="#101B35" stroke-width="3" marker-end="url(#arrow)"/><text x="822" y="597" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400">O retorno pode reabrir</text><text x="822" y="622" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400">uma decisão anterior.</text></svg>