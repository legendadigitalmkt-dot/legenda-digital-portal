<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Modelo de descoberta na busca com IA</title><desc id="desc">Conteúdo público e contexto da consulta alimentam uma mediação do sistema que pode produzir uma resposta com ou sem citações. Clareza, evidência, acesso técnico e atualização orientam ações editoriais, sem garantir inclusão.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#101B35"/></marker></defs><rect width="1400" height="760" fill="white"/><text x="60" y="60" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700">GROWTH INTELLIGENCE / LEGENDA DIGITAL</text><text x="60" y="117" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700">Como pensar a descoberta na AI Search</text><text x="60" y="158" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400">Recuperação e síntese podem usar múltiplas fontes; inclusão e citação não são garantidas.</text><text x="60" y="718" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400">MODELO CONCEITUAL • Sem escala quantitativa ou resultado medido.</text><rect x="70" y="214" width="330" height="110" rx="16" fill="white" stroke="#DCE3EC" stroke-width="2"/><text x="92" y="256" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">Conteúdo público</text><text x="92" y="293" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400">Páginas e documentos</text><rect x="70" y="369" width="330" height="110" rx="16" fill="white" stroke="#DCE3EC" stroke-width="2"/><text x="92" y="411" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">Contexto da consulta</text><text x="92" y="448" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400">Pergunta e intenção</text><rect x="535" y="285" width="345" height="130" rx="16" fill="#00D8B3" stroke="#DCE3EC" stroke-width="2"/><text x="557" y="327" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">Mediação do sistema</text><text x="557" y="364" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400">Recuperação e síntese</text><rect x="1010" y="285" width="315" height="130" rx="16" fill="#D8F36A" stroke="#DCE3EC" stroke-width="2"/><text x="1032" y="327" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">Resposta</text><text x="1032" y="364" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400">Com ou sem citações</text><path d="M400,269 L535,329" fill="none" stroke="#101B35" stroke-width="3" marker-end="url(#arrow)"/><path d="M400,424 L535,368" fill="none" stroke="#101B35" stroke-width="3" marker-end="url(#arrow)"/><path d="M880,350 L1010,350" fill="none" stroke="#101B35" stroke-width="3" marker-end="url(#arrow)"/><rect x="535" y="510" width="790" height="100" rx="12" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="2"/><text x="560" y="548" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700">AÇÕES EDITORIAIS</text><text x="560" y="580" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400">Clareza • evidência rastreável • acesso técnico • atualização</text></svg>