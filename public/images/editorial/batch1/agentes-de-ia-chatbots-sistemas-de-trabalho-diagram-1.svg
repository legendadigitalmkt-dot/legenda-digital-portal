<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Conversa e capacidade de agir</title><desc id="desc">Uma interface conversacional recebe perguntas e entrega respostas. Um fluxo com capacidade de agir executa passos com objetivo, ferramentas autorizadas, validação, registro e critérios de parada. Um chatbot pode usar ferramentas e um agente pode ter interface de chat.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#101B35"/></marker></defs><rect width="1400" height="760" fill="white"/><text x="60" y="60" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700">GROWTH INTELLIGENCE / LEGENDA DIGITAL</text><text x="60" y="117" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700">Agente e chatbot não são categorias excludentes</text><text x="60" y="158" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400">Chat é uma interface. Agência depende de ferramentas, permissões, estado e critérios de parada.</text><text x="60" y="718" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400">MODELO CONCEITUAL • Sem escala quantitativa ou resultado medido.</text><rect x="70" y="237" width="450" height="115" rx="16" fill="white" stroke="#DCE3EC" stroke-width="2"/><text x="92" y="279" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">Interface conversacional</text><text x="92" y="316" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400">Recebe pergunta e entrega resposta</text><rect x="70" y="456" width="450" height="115" rx="16" fill="#00D8B3" stroke="#DCE3EC" stroke-width="2"/><text x="92" y="498" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">Fluxo com capacidade de agir</text><text x="92" y="535" fill="#526078" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400">Executa passos sob regras e limites</text><path d="M520,513 L670,513" fill="none" stroke="#101B35" stroke-width="3" marker-end="url(#arrow)"/><rect x="670" y="232" width="655" height="371" rx="16" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="2"/><text x="695" y="277" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700">CONDIÇÕES PARA AÇÃO</text><circle cx="708" cy="329" r="9" fill="#00D8B3"/><text x="733" y="336" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400">Objetivo e contexto definidos</text><circle cx="708" cy="391" r="9" fill="#00D8B3"/><text x="733" y="398" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400">Ferramentas e acesso autorizados</text><circle cx="708" cy="453" r="9" fill="#00D8B3"/><text x="733" y="460" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400">Validação antes de ações críticas</text><circle cx="708" cy="515" r="9" fill="#00D8B3"/><text x="733" y="522" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400">Registro, limites e critério de parada</text><text x="70" y="648" fill="#101B35" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400">Um chatbot pode usar ferramentas; um agente pode conversar pelo chat.</text></svg>